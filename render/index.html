<meta charset="utf-8">
<title>Рендер mlog — стенд</title>
<style>
  body { margin: 0; background: #131316; color: #e6e6e6; font-family: system-ui, sans-serif; }
  .stand { display: grid; gap: 16px; padding: 16px; justify-items: start; }
  .stand__row { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
  .stand__bar { display: flex; gap: 8px; align-items: center; }
  textarea { width: 520px; height: 260px; background: #16161a; color: #e6e6e6; border: 1px solid #2a2a30;
             font-family: ui-monospace, monospace; font-size: 13px; padding: 8px; box-sizing: border-box; }
  canvas { image-rendering: pixelated; display: block; }
  button { background: #24242c; color: #e6e6e6; border: 1px solid #33333c; padding: 6px 10px; cursor: pointer; }
  select { background: #24242c; color: #e6e6e6; border: 1px solid #33333c; padding: 5px; }
  .stand__note, .stand__state { font-size: 12px; color: #8a8a96; line-height: 1.5; }
  .stand__state { font-family: ui-monospace, monospace; }
  h2 { font-size: 12px; font-weight: 600; color: #8a8a96; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .06em; }
</style>
<div class="stand">
  <div class="stand__bar">
    <button id="run">Заново</button>
    <button id="pause">Пауза</button>
    <button id="step">Тик</button>
    <select id="sample"></select>
  </div>

  <div class="stand__row">
    <div>
      <h2>Мир</h2>
      <canvas id="world"></canvas>
    </div>
    <div>
      <h2>Дисплей крупно</h2>
      <canvas id="display"></canvas>
    </div>
  </div>

  <div class="stand__row">
    <textarea id="code" spellcheck="false"></textarea>
    <div>
      <div class="stand__state" id="state"></div>
      <div class="stand__note" id="note"></div>
    </div>
  </div>
</div>
<script type="module" src="/demo/main.js"></script>
